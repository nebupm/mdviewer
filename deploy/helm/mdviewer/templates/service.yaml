apiVersion: v1
kind: Service
metadata:
  name: {{ include "mdviewer.fullname" . }}-svc
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "mdviewer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}
  selector:
    {{- include "mdviewer.selectorLabels" . | nindent 4 }}
